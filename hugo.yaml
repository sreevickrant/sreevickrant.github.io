baseURL: "https://sreevickrant.github.io/"
locale: "en-us"
title: "Vickrant Sreekanth"
disableKinds: ["taxonomy", "term"]

# The al-folio files still on disk must not leak into the Hugo build.
ignoreFiles: ["^_", "\\.Rmd$"]

menu:
  main:
    - name: about
      url: ""
      weight: 1

enableRobotsTXT: true

params:
  description: "Vickrant Sreekanth is a Computer Science Ph.D. student at Georgia Tech working on sparse tensor compilation, tensor networks, and code generation optimization."
  footer: "<span>&copy; {Year} <a href=\"/\">Vickrant Sreekanth</a></span><span class=\"footer-quote\">'When in doubt, use brute force.' - Ken Thompson</span>"

markup:
  goldmark:
    renderer:
      # The home page embeds the photo as raw HTML so it can float beside the bio.
      unsafe: true
