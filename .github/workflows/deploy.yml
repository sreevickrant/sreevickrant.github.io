name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          wget -qO hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Build
        run: hugo --minify
      # Pages already serves the gh-pages branch, so no repository settings change.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
